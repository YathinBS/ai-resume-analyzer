services:
  # ----------------------------------------------------------------------------
  # 1. ResumeAI Node.js Backend Service
  # ----------------------------------------------------------------------------
  - type: web
    name: resumeai-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      # Provide your Gemini API Key in the Render Dashboard
      - key: GEMINI_API_KEY
        sync: false
      # Provide your Supabase PostgreSQL connection string in the Render Dashboard
      # Format: postgresql://postgres.[project-ref]:[password]@aws-0-[region].pooler.supabase.com:6543/postgres
      - key: DATABASE_URL
        sync: false
      # Allow the Vercel frontend URL to make CORS requests (or leave blank to allow all)
      - key: ALLOWED_ORIGINS
        sync: false

  # ----------------------------------------------------------------------------
  # 2. ResumeAI Python FastAPI Microservice (Optional)
  # ----------------------------------------------------------------------------
  - type: web
    name: resumeai-fastapi
    runtime: python
    rootDir: fastapi_service
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
