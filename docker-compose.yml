version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resumeai-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/app/data
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-resumeai-production-jwt-secret-key-32chars}
    volumes:
      - resumeai-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/stats/public || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  fastapi-service:
    build:
      context: ./fastapi_service
      dockerfile: Dockerfile
    container_name: resumeai-fastapi
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    profiles:
      - full

volumes:
  resumeai-data:
